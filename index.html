<style>
  @font-face { font-family:"Space Grotesk"; src:url(space-grotesk.woff2) format("woff2"); font-weight:300 700; font-display:swap; }
  :root { --bg:#0b0b14; --card:#161625; --line:#2a2a42; --text:#f1f1f7; --muted:#9a9ab5; --accent:#8b5cf6; --accent2:#22d3ee; }
  * { box-sizing:border-box; margin:0; }
  body {
    min-height:100vh; background:var(--bg); color:var(--text);
    font-family:"Space Grotesk",system-ui,sans-serif;
    background-image:radial-gradient(circle at 20% 0%, #8b5cf633, transparent 45%), radial-gradient(circle at 90% 100%, #22d3ee22, transparent 45%);
    display:flex; justify-content:center; padding:48px 16px;
  }
  main { width:100%; max-width:440px; text-align:center; }
  .avatar { width:104px; height:104px; border-radius:50%; object-fit:cover; padding:3px; background:linear-gradient(135deg,var(--accent),var(--accent2)); }
  h1 { font-size:1.6rem; margin-top:14px; letter-spacing:.02em; }
  .bio { color:var(--muted); margin-top:6px; }
  ul { list-style:none; padding:0; margin-top:32px; display:grid; gap:12px; }
  a.link {
    display:flex; align-items:center; gap:14px; padding:14px 18px; border-radius:14px;
    background:var(--card); border:1px solid var(--line); color:var(--text); text-decoration:none; font-weight:500;
    transition:transform .15s, border-color .15s, box-shadow .15s;
  }
  a.link:hover, a.link:focus-visible { transform:translateY(-2px); border-color:var(--accent); box-shadow:0 6px 24px #8b5cf640; outline:none; }
  .ico { width:36px; height:36px; flex:none; border-radius:10px; display:grid; place-items:center; }
  .ico svg { width:20px; height:20px; fill:#fff; }
  .label { flex:1; text-align:left; }
  .label small { display:block; color:var(--muted); font-weight:400; font-size:.8rem; }
  footer { margin-top:40px; color:var(--muted); font-size:.75rem; }
</style>
</head>
